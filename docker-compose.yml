version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: personalscrum-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: personalscrum
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
#    ports:
#      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  backend-node:
    build:
      context: ./backend-node
      dockerfile: Dockerfile
    container_name: personalscrum-backend-node
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/personalscrum
      JWT_SECRET: ${JWT_SECRET:-myLocalDevelopmentSecretKeyMustBe32Chars!}
      ALLOWED_ORIGINS: http://localhost:3005
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: personalscrum-frontend
    restart: unless-stopped
    environment:
      PORT: 80
      API_UPSTREAM: backend-node:3000
    ports:
      - '3005:80'
    depends_on:
      - backend-node

volumes:
  postgres_data:
